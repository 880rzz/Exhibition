name: 2025 exhibitions — review-only HTML preview

on:
  pull_request:
    paths:
      - 'data/staging/2025-*.json'
      - 'scripts/build-2025-staging-previews.mjs'
      - 'scripts/check-2025-publication-gate.mjs'
      - 'assets/2025-exhibitions.css'
      - 'assets/styles.css'
      - 'scripts/exhibition-chronology.mjs'
      - 'scripts/build-exhibitions.mjs'
      - 'templates/exhibition-archive.html'
      - '.github/workflows/2025-staging-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build two private-review galleries only
        run: node scripts/build-2025-staging-previews.mjs
      - name: Verify the two 2025 exhibitions remain blocked without private rights evidence
        run: node scripts/check-2025-publication-gate.mjs --expect-blocked
      - name: Assert page coverage and publication lock
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('staging-preview')
          r=json.loads((root/'staging-receipt.json').read_text())
          assert r['productionReleaseApproved'] is False
          assert r['imageRightsVerified']==0
          assert r['languagePages']==6
          source=json.loads(Path('data/staging/2025-two-exhibitions.json').read_text())
          cms=json.loads(Path('data/staging/2025-cms-editorial-source.json').read_text())
          assert len(cms['records'])==32
          assert sum(1 for a in cms['records'] if a['biography'])==32
          assert all(a.get('portraitPrivateMirrorRef','').startswith('VIPACH:/images/wix-mirror/') for e in source['exhibitions'] for a in e['artistProfiles'])
          assert all(w.get('imageMirrorRef','').startswith('VIPACH:/images/wix-mirror/') for e in source['exhibitions'] for w in e['works'])
          assert r['wixCmsRecords']==32
          assert r['wixFullBiographies']==32
          assert r['wixArtworkDescriptions']==32
          cms_by_id={a['id']:a for a in cms['records']}
          def source_description(w):
              item=cms_by_id.get(w.get('wixRecordId'))
              if not item: return ''
              if w.get('sourceImageSlot')=='artwork-1': return item.get('firstArtworkDescription','')
              if w.get('sourceImageSlot')=='artwork-2': return item.get('secondArtworkDescription','')
              return ''
          expected_original_details={}
          for ex in source['exhibitions']:
              originals=sum(bool(source_description(w)) for w in ex['works'])
              expected_original_details[ex['slug']]=len(ex['artistProfiles'])+originals
          assert sorted((x['artists'],x['works']) for x in r['exhibitions'])==[(15,20),(19,20)]
          for slug,artist_count in [('eletem-kepe',15),('as-i-like-it-austria',19)]:
              for lang in ('hu','en','de'):
                  p=root/lang/slug/'index.html'
                  assert p.is_file(),p
                  s=p.read_text(encoding='utf-8')
                  assert 'noindex,nofollow,noimageindex' in s,p
                  assert 'PREPUBLICATION-REVIEW-NOT-LICENSED' in s,p
                  assert s.count('class="exhibitor-card"')==artist_count,(p,'SPONTAN exhibitor layout')
                  assert s.count('class="exhibitor-work-image"')==20,(p,'artwork images')
                  assert s.count('class="exhibitor-portrait"')==artist_count,(p,'artist portrait layout')
                  assert s.count('class="prose ex25-source-text"')==expected_original_details[slug],(p,'original Wix biographies and artwork narratives',s.count('class="prose ex25-source-text"'),expected_original_details[slug])
                  for cls in ('hero ex25-exhibition-hero','section exhibitor-section','credits','history','visit','section image-rights'):
                      assert 'class="'+cls+'"' in s,(p,'shared design section',cls)
                  assert 'class="site-menu"' in s and 'class="exhibition-nav-group"' in s
                  assert 'id="hero-title"' in s and 'id="exhibitors-title"' in s
                  assert '../../assets/styles.css' in s and '../../assets/2025-exhibitions.css' in s
                  assert 'noindex,nofollow,noimageindex' in s
          print('PASS six staged gallery pages; 40 Wix media references, 34 artists; no production authorization')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 2025-exhibitions-internal-review-html
          path: staging-preview/
          retention-days: 7
