name: Exhibition schema / canonical entity regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hu/**'
      - 'de/**'
      - 'spontan-2026/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '.github/workflows/validate-schema.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'hu/**'
      - 'de/**'
      - 'spontan-2026/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '.github/workflows/validate-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exhibition pages from data
        run: node scripts/build-exhibitions.mjs
      - name: Validate multi-exhibition schema (featured + archives)
        run: node scripts/validate-schema.mjs
