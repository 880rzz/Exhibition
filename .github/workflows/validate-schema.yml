name: Exhibition schema / canonical entity regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hu/**'
      - 'de/**'
      - 'spontan-2026/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '_config.yml'
      - 'llms.txt'
      - '.github/workflows/validate-schema.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'hu/**'
      - 'de/**'
      - 'spontan-2026/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '_config.yml'
      - 'llms.txt'
      - '.github/workflows/validate-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact owner-attested 2025 archive uses and prevent all other publication
        run: node scripts/check-2025-public-source-separation.mjs
      - name: Assert 40 gallery images have confirmed Wix artist mapping
        run: node scripts/check-2025-gallery-attribution.mjs
      - name: Verify committed 2025 archive content and 3L permanent navigation
        run: node scripts/test-2025-archive-release.mjs
      - name: Verify committed multilingual press coverage before build
        run: node scripts/check-exhibition-press.mjs
      - name: Verify committed Pages HTML has navigation BEFORE generation
        run: node scripts/test-exhibition-navigation.mjs
      - name: Build exhibition pages from data
        run: node scripts/build-exhibitions.mjs
      - name: Verify rebuilt 2025 archive content and 3L permanent navigation
        run: node scripts/test-2025-archive-release.mjs
      - name: Regenerate current published-image rights inventory
        run: |
          node scripts/inventory_published_images.mjs
          node -e 'const x=require("./docs/IMAGE_RIGHTS_INVENTORY.json"); if(x.totals.uniqueImageRefs<20||x.separation.historical2025Works.eletemKepeWorks!==20||x.separation.historical2025Works.asILikeItWorks!==20||x.separation.historical2025Works.licenceVerifiedApprovedForPublicDisplay!==0) process.exit(1); console.log("Image rights inventory PASS", x.totals)'
      - name: Validate multi-exhibition schema (featured + archives)
        run: node scripts/validate-schema.mjs
      - name: Verify latest published homepage and historical hamburger menu
        run: node scripts/test-exhibition-navigation.mjs
      - name: Verify generated press coverage after exhibition build
        run: node scripts/check-exhibition-press.mjs
      - name: Build public GitHub Pages output with Jekyll
        uses: actions/jekyll-build-pages@v1
      - name: Assert staging JSON and source code are not in published Jekyll artifact
        run: |
          test -f _site/index.html
          test ! -e _site/data/staging
          test ! -e _site/scripts
          test ! -e _site/docs
          test ! -e _site/staging-preview
          test ! -e _site/private-review
          echo 'PASS: exhibition staging sources absent from site artifact'
