# GitHub Pages builds the committed public Exhibition site.
# Staging source files belong to the GitHub repository, not to the served website.
# These exclusions do NOT make files private in a public GitHub repository.
title: VIPACH Exhibitions
exclude:
  - data/staging
  # Keep build inputs in version control; the normalized feed is data/public/exhibitions.json.
  - data/exhibitions/spontan-2026.json
  - data/exhibitions/eletem-kepe.json
  - data/exhibitions/as-i-like-it-austria.json
  - staging-preview
  - docs
  - scripts
  - templates
  - node_modules
  - private-review
